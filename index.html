<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>OS Clicker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0a0a14;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;overflow-x:hidden}
h1{font-size:20px;color:#a855f7;letter-spacing:1px;margin-bottom:4px}
.ver{font-size:13px;color:#888;margin-bottom:8px}
.coins{font-size:30px;font-weight:700;margin:6px 0;color:#fff}
.coins small{font-size:14px;color:#a855f7;font-weight:400}
.rebirth-info{font-size:12px;color:#22c55e;margin-bottom:8px}
.pc{font-size:100px;cursor:pointer;transition:transform .1s;filter:drop-shadow(0 0 20px #a855f7);margin:16px 0;line-height:1}
.pc:active{transform:scale(.9)}
.shop{width:100%;max-width:420px}
.upgrade{background:#15152a;border:1px solid #2a2a4a;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}
.upgrade:hover{border-color:#a855f7}
.upgrade.disabled{opacity:.4;cursor:not-allowed}
.upgrade .info{flex:1}
.upgrade .name{font-weight:600;font-size:14px}
.upgrade .desc{font-size:11px;color:#888;margin-top:2px}
.upgrade .price{color:#a855f7;font-weight:700;font-size:13px;white-space:nowrap;margin-left:8px}
.upgrade .count{color:#22c55e;font-size:11px;margin-left:4px}
.rebirth{width:100%;max-width:420px;margin-top:10px;padding:14px;background:#a855f7;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.rebirth:disabled{background:#333;color:#666;cursor:not-allowed}
</style>
</head>
<body>
<h1>OS CLICKER</h1>
<div class="ver" id="ver">DOS 1.0</div>
<div class="coins" id="coins">0 <small>⚡</small></div>
<div class="rebirth-info" id="rebirthInfo"></div>
<div class="pc" id="pc">💻</div>
<div class="shop" id="shop"></div>
<button class="rebirth" id="rebirthBtn" disabled>Перерождение (нужен топ)</button>

<script>
// Список ОС от древних к новым
const OS_LIST = [
  {name:"DOS 1.0", emoji:"🖥️", mult:1},
  {name:"Windows 3.1", emoji:"🪟", mult:3},
  {name:"Windows 95", emoji:"🪟", mult:8},
  {name:"Windows 98", emoji:"🪟", mult:18},
  {name:"Windows XP", emoji:"🪟", mult:40},
  {name:"Windows 7", emoji:"🪟", mult:90},
  {name:"Windows 10", emoji:"🪟", mult:200},
  {name:"Windows 11", emoji:"🪟", mult:450},
  {name:"Ubuntu 20.04", emoji:"🐧", mult:1000},
  {name:"Arch Linux", emoji:"🐧", mult:2500},
  {name:"Kali Linux", emoji:"🐧", mult:6000},
  {name:"macOS Ventura", emoji:"🍎", mult:15000},
  {name:"Fedora Workstation", emoji:"🐧", mult:40000},
  {name:"Windows 12 Quantum", emoji:"🔮", mult:100000},
  {name:"OS Singularity", emoji:"⚡", mult:500000}
];

let state = {
  coins: 0,
  osIndex: 0,
  rebirths: 0,
  rebirthMult: 1,
  upgrades: {
    click: {name:"Мышь быстрее", desc:"+1 к клику", base:15, count:0},
    cpu:   {name:"Мощный CPU", desc:"+1 ⚡/сек", base:40, count:0},
    ram:   {name:"Больше RAM", desc:"x2 к клику", base:400, count:0},
    gpu:   {name:"Видеокарта", desc:"+10 ⚡/сек", base:600, count:0},
    ssd:   {name:"SSD диск", desc:"+50 ⚡/сек", base:3000, count:0},
    server:{name:"Сервер", desc:"+200 ⚡/сек", base:15000, count:0}
  }
};

const saved = localStorage.getItem('osClicker');
if (saved) { try { const s = JSON.parse(saved); Object.assign(state, s); } catch(e){} }

const $ = id => document.getElementById(id);
const $coins = $('coins'), $pc = $('pc'), $shop = $('shop'), $ver = $('ver'), $rebirthInfo = $('rebirthInfo'), $rebirthBtn = $('rebirthBtn');

function fmt(n){
  if (n >= 1e12) return (n/1e12).toFixed(2)+'T';
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n);
}

function currentOS(){ return OS_LIST[state.osIndex]; }

function getCost(key){
  const u = state.upgrades[key];
  return Math.floor(u.base * Math.pow(1.15, u.count));
}

function getPerClick(){
  let base = 1 + state.upgrades.click.count;
  base *= Math.pow(2, state.upgrades.ram.count);
  base *= currentOS().mult;
  base *= state.rebirthMult;
  return base;
}

function getPerSec(){
  let base = state.upgrades.cpu.count + state.upgrades.gpu.count*10 + state.upgrades.ssd.count*50 + state.upgrades.server.count*200;
  base *= currentOS().mult;
  base *= state.rebirthMult;
  return base;
}

function render(){
  $coins.innerHTML = fmt(state.coins) + ' <small>⚡</small>';
  $ver.textContent = currentOS().name + (state.rebirths > 0 ? ' | Перерождений: '+state.rebirths+' (x'+state.rebirthMult+')' : '');
  $pc.textContent = currentOS().emoji;
  $rebirthInfo.textContent = 'Клик: '+fmt(getPerClick())+' | В сек: '+fmt(getPerSec());
  
  // Проверка апгрейда ОС
  const nextOS = OS_LIST[state.osIndex + 1];
  let html = '';
  if (nextOS) {
    const cost = Math.floor(500 * Math.pow(6, state.osIndex));
    const can = state.coins >= cost;
    html += '<div class="upgrade '+(can?'':'disabled')+'" data-os="1">' +
      '<div class="info"><div class="name">⬆️ Апгрейд до: '+nextOS.name+'</div>' +
      '<div class="desc">x'+nextOS.mult+' к доходу</div></div>' +
      '<div class="price">'+fmt(cost)+' ⚡</div></div>';
  } else {
    html += '<div class="upgrade" style="border-color:#22c55e">' +
      '<div class="info"><div class="name">🏆 Максимальная ОС!</div>' +
      '<div class="desc">Делай перерождение для x2</div></div></div>';
  }
  
  for (const key in state.upgrades) {
    const u = state.upgrades[key];
    const cost = getCost(key);
    const can = state.coins >= cost;
    html += '<div class="upgrade '+(can?'':'disabled')+'" data-key="'+key+'">' +
      '<div class="info"><div class="name">'+u.name+' <span class="count">x'+u.count+'</span></div>' +
      '<div class="desc">'+u.desc+'</div></div>' +
      '<div class="price">'+fmt(cost)+' ⚡</div></div>';
  }
  $shop.innerHTML = html;
  
  document.querySelectorAll('.upgrade').forEach(el => {
    el.onclick = () => {
      if (el.dataset.os) buyOS();
      else buy(el.dataset.key);
    };
  });
  
  $rebirthBtn.disabled = state.osIndex < OS_LIST.length - 1;
}

function buyOS(){
  const nextOS = OS_LIST[state.osIndex + 1];
  if (!nextOS) return;
  const cost = Math.floor(500 * Math.pow(6, state.osIndex));
  if (state.coins < cost) return;
  state.coins -= cost;
  state.osIndex++;
  render(); save();
}

function buy(key){
  const cost = getCost(key);
  if (state.coins < cost) return;
  state.coins -= cost;
  state.upgrades[key].count++;
  render(); save();
}

$pc.onclick = () => {
  state.coins += getPerClick();
  $pc.style.transform = 'scale(0.9)';
  setTimeout(()=>{ $pc.style.transform=''; }, 80);
  render();
};

$rebirthBtn.onclick = () => {
  if (state.osIndex < OS_LIST.length - 1) return;
  if (!confirm('Перерождение? Весь прогресс сбросится, но доход x2 навсегда.')) return;
  state.rebirths++;
  state.rebirthMult *= 2;
  state.coins = 0;
  state.osIndex = 0;
  for (const k in state.upgrades) state.upgrades[k].count = 0;
  render(); save();
};

setInterval(() => {
  const ps = getPerSec();
  if (ps > 0) { state.coins += ps; render(); }
}, 1000);

setInterval(save, 5000);
function save(){ localStorage.setItem('osClicker', JSON.stringify(state)); }

render();
</script>
</body>
  </html>
